name: gmd-lint

# Validates that this repo's own GMD docs lint clean against the bundled linter.
# gmd is the canonical GMD tooling, so it dogfoods its own spec — see SPEC.md.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gmd-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint GMD docs
        run: |
          ./scripts/lint-gmd.sh
      # The self-lint above cannot catch a DEMOTED gate: once the corpus is
      # clean, a check that stopped checking reports the same zero. This runs
      # the gates against fixtures that must fail.
      - name: Lint gates (behaviour, not error counts)
        run: |
          python3 scripts/test-lint-gates.py
